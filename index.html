<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitJourneyAI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
.passbox summary{cursor:pointer}
</style>
<title>FitJourneyAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first app. Dark "court" header with brand; bottom tab bar on phones, pill tabs in the header on wide screens.
   One column of cards, two on wide screens. Orange = basketball/action, green = done, blue = water only. */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --surface-2:#f3f5f9; --line:#e2e7ef; --line-2:#cfd7e3;
  --ink:#0f1724; --muted:#5a6578; --accent:#ef6418; --accent-ink:#ffffff; --accent-soft:#ffebdd;
  --court:#0d1a2e; --court-2:#18294a; --court-ink:#f4f7fb;
  --good:#14995a; --good-soft:#e1f5e9; --warn:#c27a00;
  --water:#2c8de6; --water-soft:#e2effc;
  --shadow:0 1px 2px rgba(15,23,36,.05),0 10px 28px -16px rgba(15,23,36,.22);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090f18; --surface:#111925; --surface-2:#18212f; --line:#222d3e; --line-2:#2e3b50;
  --ink:#e9eef5; --muted:#97a4b8; --accent:#ff7a30; --accent-ink:#1b0b01; --accent-soft:#36210f;
  --court:#0b1524; --court-2:#152440; --court-ink:#f4f7fb;
  --good:#3cc07c; --good-soft:#0f2d1d; --warn:#e6a43e; --water:#4aa6f6; --water-soft:#10243b;
  --shadow:0 0 0 1px var(--line); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090f18; --surface:#111925; --surface-2:#18212f; --line:#222d3e; --line-2:#2e3b50;
  --ink:#e9eef5; --muted:#97a4b8; --accent:#ff7a30; --accent-ink:#1b0b01; --accent-soft:#36210f;
  --court:#0b1524; --court-2:#152440; --court-ink:#f4f7fb;
  --good:#3cc07c; --good-soft:#0f2d1d; --warn:#e6a43e; --water:#4aa6f6; --water-soft:#10243b;
  --shadow:0 0 0 1px var(--line); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--court);color:var(--court-ink);
  background-image:radial-gradient(120% 140% at 100% 0%,rgba(239,100,24,.22),transparent 55%)}
.top .wrap{padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.65rem;letter-spacing:.01em;margin:0;line-height:1}
.brand h1 span{color:var(--accent)}
.sync{font-size:.72rem;opacity:.7;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}

/* Tabs: bottom bar on phones */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted);
  font-size:.68rem;font-weight:600;letter-spacing:.01em;cursor:pointer;position:relative;transition:color .2s}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button[aria-selected="true"] svg{transform:translateY(-1px) scale(1.06)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
main .wrap{padding-block:18px calc(104px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){
  nav.tabs{position:static;display:flex;gap:4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:4px;backdrop-filter:none;-webkit-backdrop-filter:none}
  nav.tabs button{flex-direction:row;gap:7px;font-size:.88rem;padding:8px 14px;color:rgba(244,247,251,.7)}
  nav.tabs svg{width:18px;height:18px}
  nav.tabs button:hover{color:var(--court-ink);background:rgba(255,255,255,.06)}
  nav.tabs button[aria-selected="true"]{background:var(--court-ink);color:var(--court)}
  nav.tabs button[aria-selected="true"]::before{display:none}
  nav.tabs button[aria-selected="true"] svg{transform:none}
  main .wrap{padding-block:28px 56px}
  .top .wrap{padding-block:14px}
}

/* Layout */
section.view{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
.grid2>*,.block{min-width:0}
@media(min-width:760px){.grid2{grid-template-columns:1.2fr 1fr;align-items:start}}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card>.block+.block{border-top:1px solid var(--line);padding-top:14px}
h2{font-family:var(--display);font-weight:800;letter-spacing:.01em;font-size:1.5rem;margin:0;line-height:1.05;text-wrap:balance}
h3{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* Day scoreboard */
.score{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--court) 0%,var(--court-2) 100%);color:var(--court-ink);border-radius:22px;padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;box-shadow:0 18px 40px -24px rgba(13,26,46,.7)}
.score::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,255,255,.07);box-shadow:0 0 0 38px rgba(255,255,255,.025);pointer-events:none}
.score>*{position:relative;z-index:1}
.ring{width:96px;height:96px}
.ring text{font-family:var(--mono);font-weight:700}
.ring .arc{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.score .eyebrow{opacity:.7}
.score .day{font-family:var(--display);font-size:2.2rem;font-weight:800;line-height:1;margin-top:2px}
.score .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.score .meta span{font-size:.75rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:3px 9px;white-space:nowrap}
.score .meta b{font-family:var(--mono);color:var(--accent);font-weight:700}
.datenav{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.datenav button{background:rgba(255,255,255,.1);color:var(--court-ink);border:0;border-radius:99px;padding:6px 12px;font-size:.78rem;font-weight:600;cursor:pointer}
.datenav button:hover{background:rgba(255,255,255,.18)}
@media(max-width:400px){.score{grid-template-columns:1fr;justify-items:start}.ring{width:84px;height:84px}}

/* Checkboxes */
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:8px;border:2px solid var(--line-2);background:var(--surface);
  display:grid;place-content:center;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
input[type=checkbox]::after{content:"";width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
input[type=checkbox]:checked{background:var(--good);border-color:var(--good)}
input[type=checkbox]:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
input[type=checkbox]:active{transform:scale(.9)}

/* Exercise rows */
.block{display:flex;flex-direction:column;gap:8px}
.ex{display:grid;grid-template-columns:24px 1fr;gap:6px 12px;align-items:start;padding:12px;border-radius:14px;background:var(--surface-2);transition:background .25s}
.ex.done{background:var(--good-soft)}
.ex>input[type=checkbox]{margin-top:1px}
.ex label{cursor:pointer;min-width:0}
.ex .name{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex.done .name{color:var(--muted)}
.ex .dose{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-top:1px}
.ex .log{grid-column:2;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-size:.85rem}
.ex>span{display:none}
.tag{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.how{font-size:.82rem;color:var(--muted);margin-top:2px}

/* Habits */
.habit{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--surface-2);cursor:pointer;transition:background .25s}
.habit.done{background:var(--good-soft)}
.habit.done{color:var(--ink)}

/* Water bottles */
.water{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.bottle{background:none;border:0;padding:4px 2px;cursor:pointer;line-height:0;border-radius:10px;transition:transform .15s}
.bottle:active{transform:scale(.92)}
.bottle svg{width:34px;height:60px;display:block}
.bottle .shell{fill:var(--water-soft);stroke:var(--water);stroke-width:1.6}
.bottle .cap{fill:var(--water)}
.bottle .liquid{fill:var(--water);transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.bottle.full .liquid{transform:scaleY(1)}
.bottle .shine{fill:#fff;opacity:.35}
.wsum{display:flex;flex-direction:column;margin-left:4px}
.wsum b{font-family:var(--mono);font-size:1.15rem;color:var(--water)}

/* Forms */
textarea,input[type=text],input[type=number],input[type=password],input[type=time],select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;width:100%;transition:border-color .15s,box-shadow .15s}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:72px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600}

/* Week */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.dcard{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow);border:2px solid transparent}
.dcard.today{border-color:var(--accent)}
.dcard .dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dcard .dn{font-family:var(--display);font-weight:800;font-size:1.5rem}
.dcard ul{margin:0;padding-left:18px;font-size:.86rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.dcard ul b{color:var(--ink);font-weight:600}
.pips{display:flex;gap:4px}
.pip{width:12px;height:12px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.pip.on{background:var(--good);border-color:var(--good)}
.pip.half{background:var(--warn);border-color:var(--warn)}

/* Buttons */
.prform{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.95rem;cursor:pointer;align-self:flex-start;transition:transform .12s,filter .15s;box-shadow:0 6px 16px -8px var(--accent)}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.sm{font-size:.82rem;padding:7px 12px;border-radius:10px}
.btn:disabled{opacity:.6;cursor:default}

/* Stats */
.bests{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.best{background:var(--surface-2);border-radius:14px;padding:12px}
.best .v{font-family:var(--mono);font-weight:700;font-size:1.55rem;line-height:1.1}
.best .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:4px}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.num{font-family:var(--mono)}
.chart svg{width:100%;height:auto;display:block}
.empty{border:1.5px dashed var(--line-2);border-radius:14px;padding:18px;color:var(--muted);font-size:.9rem;text-align:center}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:.85rem;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--line-2)}
.chip.out{opacity:.45;text-decoration:line-through}
.chip .x{color:var(--muted);font-weight:700}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}
.combo{padding:12px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.combo b{font-weight:600}
ul.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.note{padding:12px 14px;background:var(--accent-soft);border-radius:14px;font-size:.9rem}

/* Food */
.mbar{display:flex;flex-direction:column;gap:6px}
.mtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fill.hit{background:var(--good)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macros .v{font-size:1.2rem}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.food{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 34px 10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .12s,background .15s}
.food:hover{border-color:var(--accent)}
.food:active{transform:scale(.97)}
.food .fn{font-weight:600;font-size:.9rem;line-height:1.25}
.food .fm{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.food .plus{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-content:center;font-weight:700;font-size:.9rem;line-height:1}
.food.pop{animation:pop .35s}
@keyframes pop{40%{background:var(--accent-soft);border-color:var(--accent)}}
.eats{display:flex;flex-direction:column}
.eat{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.eat:last-child{border-bottom:0}
.eat .en{font-weight:600;min-width:0}
.eat .em{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px}
.qb{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font-weight:700;line-height:1}
.xbtn{width:28px;height:28px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1}
.xbtn:hover{background:var(--surface-2);color:var(--ink)}
.cf{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:6px}
@media(max-width:520px){.cf{grid-template-columns:1fr 1fr}.cf #cf-n{grid-column:1/3}}
.scan{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--accent-soft);flex-wrap:wrap}
.scan .small{flex:1;min-width:160px}
.scanbtn{display:inline-block}
.fedit input{padding:6px 8px;font-size:.85rem;min-width:60px;border-radius:8px}
.fedit select{padding:6px 8px;font-size:.85rem;border-radius:8px;min-width:110px}
.fedit td{padding:4px}
details.card>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .2s;flex:none;margin-right:4px}
details.card[open]>summary::after{transform:rotate(-135deg) translateY(-3px)}
details.card:not([open]){gap:0}

/* Coach */
.chat{display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .3s ease-out}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{min-height:48px;flex:1;min-width:0}
.passbox summary{cursor:pointer}

/* Reminders */
.remstat{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.remstat>div{flex:1;min-width:0}
.remstat .dot{width:10px;height:10px;border-radius:50%;background:var(--line-2);flex:none}
.remstat.on{background:var(--good-soft)}
.remstat.on .dot{background:var(--good);box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 25%,transparent)}
.rems{display:flex;flex-direction:column}
.rem{display:grid;grid-template-columns:24px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:0}
.rem .rn{display:flex;flex-direction:column;min-width:0;cursor:pointer}
.rem input[type=time]{width:auto;padding:7px 8px;font-family:var(--mono);font-size:.82rem}
.rem select{width:auto;padding:7px 8px;font-size:.82rem}
.rem.off .rn,.rem.off input[type=time],.rem.off select{opacity:.5}
@media(max-width:480px){.rem{grid-template-columns:24px 1fr auto}.rem select{grid-column:2/4;justify-self:start}}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:9;background:var(--ink);color:var(--surface);
  padding:9px 16px;border-radius:99px;font-size:.85rem;font-weight:600;pointer-events:none;transition:opacity .2s,transform .25s;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){.toast{bottom:28px}}

/* Gentle entrance when switching tabs */
section.view.enter>*{animation:rise .35s ease-out both}
section.view.enter>*:nth-child(2){animation-delay:.04s}
section.view.enter>*:nth-child(3){animation-delay:.08s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- The plan ---------- */
const PULL = {name:"Pull-up ladder", items:[
  {id:"p1",n:"Assisted chin-ups",d:"2 × 10"},
  {id:"p2",n:"Assisted pull-ups",d:"2 × 10"},
  {id:"p3",n:"Assisted neutral-grip",d:"2 × 5"},
  {id:"p4",n:"Assisted archer pull-ups",d:"2 × 3"},
  {id:"p5",n:"Dead hang",d:"2 × 15 s"}]};
const PLAN = {
 1:{title:"Hoops + Hops",items:[
   {name:"Basketball",items:[{id:"bb",n:"Basketball",d:"2 hours"}]},
   {name:"Speed & jumps",items:[
     {id:"hk",n:"High knees",d:"4 × 20 s"},{id:"ff",n:"Fast feet",d:"4 × 20 s"},
     {id:"slbj",n:"Single-leg box jumps",d:"8 each leg"},{id:"ebj",n:"Explosive box jumps",d:"8 each"},
     {id:"pl",n:"Plank",d:"2 × 1 min"}]},PULL]},
 2:{title:"Upper Body",items:[
   {name:"Upper",items:[
     {id:"pu",n:"Push-ups",d:"3 sets",how:"Write your reps for each set, like 15/13/12."},
     {id:"pc",n:"Preacher curls",d:"3 sets, 1–2 reps short of failure"},
     {id:"sp",n:"Shoulder press",d:"3 sets, 1–2 reps short of failure"},
     {id:"row",n:"One-arm dumbbell row",d:"3 × 10 each arm",isNew:true,how:"Knee and hand on the bench, pull the dumbbell to your hip."},
     {id:"plf",n:"Plank",d:"1 max hold",how:"Log your time."}]}]},
 3:{title:"Hoops + Bar",items:[
   {name:"Basketball",items:[{id:"bb",n:"Basketball",d:"2 hours"}]},PULL]},
 4:{title:"Legs + Core",items:[
   {name:"Legs",items:[
     {id:"gs",n:"Goblet squats",d:"3 × 12"},{id:"cr",n:"Calf raises",d:"3 × 20"},
     {id:"lr",n:"Leg raises",d:"3 × 12"},{id:"su",n:"Step-ups",d:"15 each side"},
     {id:"bj",n:"Box jumps",d:"10 each side"},
     {id:"rdl",n:"Dumbbell Romanian deadlift",d:"3 × 10, light",isNew:true,how:"Soft knees, push hips back, flat back."}]}]},
 5:{title:"Bar Day",items:[PULL]},
 6:{title:"Game Day",items:[{name:"Basketball",items:[{id:"bb",n:"Basketball",d:"Play"}]}]},
 0:{title:"Fight + Test",items:[
   {name:"Pull-up max test (do it first, while fresh)",items:[{id:"prt",n:"Test all 5 pull-up moves",d:"Max reps",how:"Log your numbers on the Progress tab."}]},
   {name:"MMA",items:[{id:"mma",n:"MMA workout",d:"Full session"}]}]}
};
const DAYN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DIET=[
 {id:"h_smooth",n:"Morning smoothie with protein (yogurt, milk or peanut butter)"},
 {id:"h_lunch",n:"Protein at lunch"},
 {id:"h_dinner",n:"Protein at dinner"},
 {id:"h_fv",n:"3+ fruits or veggies"},
 {id:"h_snack",n:"Fuel before practice (banana or dates)"}];
const CARE=[
 {id:"h_sleep",n:"9 hours of sleep last night"},
 {id:"h_stretch",n:"Stretched 5 minutes"},
 {id:"h_shower",n:"Showered and changed after training"}];
const HABITS=[...DIET,...CARE];
const WATER_GOAL=4; const BOTTLE_OZ=16.9;
const MAXEX=[["Chin-ups","reps"],["Pull-ups","reps"],["Neutral-grip pull-ups","reps"],["Archer pull-ups","reps"],["Dead hang","sec"],["Push-ups","reps"],["Plank","sec"],["Goblet squat","lb"],["Shoulder press","lb"]];
const PULLTEST=[["Chin-ups","reps"],["Pull-ups","reps"],["Neutral-grip pull-ups","reps"],["Archer pull-ups","reps"],["Dead hang","sec"]];

/* ---------- State ---------- */
const DEFAULT={
  pantry:[
    {n:"Bananas",have:true},{n:"Strawberries",have:true},{n:"Dates",have:true},{n:"Cheese sticks",have:true},
    {n:"Yogurt",have:true},{n:"Hummus",have:true},{n:"Chicken",have:true},{n:"Bread",have:true}],
  foods:[
    {id:"f1",cat:"Meals",n:"Morning smoothie",s:"banana, 1 cup strawberries, Greek yogurt, 1 cup milk",cal:375,p:27,c:57,f:6},
    {id:"f2",cat:"Meals",n:"Chicken sandwich",s:"2 slices bread, 3 oz chicken",cal:350,p:30,c:30,f:10},
    {id:"f13",cat:"Protein",n:"Crispy chicken",s:"4 oz (about 3 tenders)",cal:330,p:22,c:18,f:18},
    {id:"f14",cat:"Protein",n:"Grilled chicken",s:"4 oz",cal:185,p:35,c:0,f:4},
    {id:"f15",cat:"Protein",n:"Steak",s:"4 oz sirloin, cooked",cal:240,p:34,c:0,f:11},
    {id:"f11",cat:"Protein",n:"Egg",s:"1 large",cal:70,p:6,c:0,f:5},
    {id:"f16",cat:"Veggies",n:"Cauliflower rice",s:"1 cup cooked",cal:25,p:2,c:5,f:0},
    {id:"f17",cat:"Veggies",n:"Broccoli",s:"1 cup cooked",cal:55,p:4,c:11,f:1},
    {id:"f18",cat:"Veggies",n:"Cauliflower",s:"1 cup cooked",cal:30,p:2,c:5,f:1},
    {id:"f19",cat:"Veggies",n:"Broccoli & cauliflower",s:"1 cup cooked mix",cal:40,p:3,c:8,f:1},
    {id:"f12",cat:"Carbs",n:"Rice",s:"1 cup cooked",cal:205,p:4,c:45,f:0},
    {id:"f4",cat:"Fruit",n:"Banana",s:"1 medium",cal:105,p:1,c:27,f:0},
    {id:"f5",cat:"Fruit",n:"Strawberries",s:"1 cup",cal:50,p:1,c:12,f:0},
    {id:"f6",cat:"Fruit",n:"Dates",s:"2 Medjool",cal:130,p:1,c:36,f:0},
    {id:"f3",cat:"Snacks & dairy",n:"Cheese stick",s:"1 stick",cal:80,p:7,c:1,f:6},
    {id:"f8",cat:"Snacks & dairy",n:"Greek yogurt",s:"6 oz cup, plain",cal:100,p:17,c:6,f:0},
    {id:"f9",cat:"Snacks & dairy",n:"Milk",s:"1 cup, 2%",cal:120,p:8,c:12,f:5},
    {id:"f7",cat:"Snacks & dairy",n:"Hummus",s:"2 tbsp",cal:70,p:2,c:4,f:5},
    {id:"f10",cat:"Snacks & dairy",n:"Peanut butter",s:"2 tbsp",cal:190,p:7,c:7,f:16}],
  targets:{cal:2400,p:60},
  gear:["Resistance bands","Bench / press chair","Dumbbells","Plyo box","Pull-up bar"],
  dumbbells:"", bands:"", goals:"Gain muscle, lose fat, get my first unassisted pull-up, jump higher for basketball.",
  logs:{}, prs:[], maxes:[], body:[],
  reminders:[
    {id:"workout",on:true,t:"17:00",days:"all"},
    {id:"water",on:true,t:"15:30",days:"wk"},
    {id:"night",on:true,t:"20:30",days:"all"},
    {id:"bed",on:true,t:"22:00",days:"wk"}]
};
function hydrate(j){const s=Object.assign(structuredClone(DEFAULT),j||{});
  // move old pull-up test entries into maxes
  if(s.prs&&s.prs.length){const map={chin:"Chin-ups",pull:"Pull-ups",neut:"Neutral-grip pull-ups",arch:"Archer pull-ups",hang:"Dead hang"};
    s.prs.forEach(p=>Object.entries(map).forEach(([k,n])=>{if(p[k]!==undefined&&p[k]!=="")s.maxes.push({id:p.id+k,date:p.date,ex:n,val:+p[k],unit:k==="hang"?"sec":"reps",note:p.band||""})}));s.prs=[]}
  // add new built-in foods once (foods you removed stay removed)
  const seeded=new Set(s.seeded||s.foods.map(f=>f.id));
  DEFAULT.foods.forEach(df=>{if(!seeded.has(df.id)&&!s.foods.some(f=>f.id===df.id))s.foods.push(structuredClone(df))});
  s.seeded=DEFAULT.foods.map(f=>f.id);
  s.foods.forEach(f=>{if(!f.cat)f.cat=(DEFAULT.foods.find(d=>d.id===f.id)||{}).cat||"My foods"});
  if(!Array.isArray(s.reminders)||!s.reminders.length)s.reminders=structuredClone(DEFAULT.reminders);
  // water used to be 8 cups, now bottles (2 cups ≈ 1 bottle)
  Object.values(s.logs||{}).forEach(l=>{if(l&&!l.wb){l.water=Math.ceil((l.water||0)/2);l.wb=1}});
  return s}
let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem("cb_state")||"null");if(j)return hydrate(j)}catch(e){}return hydrate(null)}
let dbDoc=null, saveT=null;
const syncEl=document.getElementById("sync");
function save(){
  try{localStorage.setItem("cb_state",JSON.stringify(S))}catch(e){}
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    if(!dbDoc){syncEl.textContent="Saved on this phone";return}
    try{await dbDoc.set({json:JSON.stringify(S),at:Date.now()});syncEl.textContent="Saved ✓"}
    catch(e){syncEl.textContent="Saved on this phone"}
  },700);
}
syncEl.textContent="Saved on this phone";

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromKey=k=>{const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)};
let cur=new Date(); cur.setHours(0,0,0,0);
const todayKey=()=>key(new Date());
function logFor(k){const l=S.logs[k]||(S.logs[k]={ex:{},notes:{},habits:{},water:0,wb:1,food:"",eats:[]});l.eats=l.eats||[];return l}
function exIds(dow){return PLAN[dow].items.flatMap(b=>b.items.map(i=>i.id))}
function workoutPct(k){const l=S.logs[k];if(!l)return 0;const ids=exIds(fromKey(k).getDay());return ids.filter(i=>l.ex[i]).length/ids.length}
function carePct(k){const l=S.logs[k];if(!l)return 0;return (HABITS.filter(h=>l.habits[h.id]).length+Math.min(l.water||0,WATER_GOAL)/WATER_GOAL)/(HABITS.length+1)}
function dayScore(k){return (workoutPct(k)+carePct(k))/2}
function streak(){
  let d=new Date();d.setHours(0,0,0,0);let n=0;
  if(dayScore(key(d))<.7)d.setDate(d.getDate()-1);
  while(dayScore(key(d))>=.7){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ---------- Tabs ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function showTab(t){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  document.querySelectorAll("section.view").forEach(s=>{s.hidden=s.id!=="v-"+t;s.classList.toggle("enter",!s.hidden)});
  clearTimeout(showTab.t);showTab.t=setTimeout(()=>document.querySelectorAll("section.view.enter").forEach(s=>s.classList.remove("enter")),500);
  try{localStorage.setItem("cb_tab2",t)}catch(e){}
  window.scrollTo(0,0);
}

/* ---------- Shared day header ---------- */
function ring(p){
  const r=38,c=2*Math.PI*r,o=c*(1-p);
  return `<svg class="ring" viewBox="0 0 92 92" role="img" aria-label="${Math.round(p*100)} percent done">
  <circle cx="46" cy="46" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="9"/>
  <circle class="arc" cx="46" cy="46" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 46 46)"/>
  <text x="46" y="52" text-anchor="middle" font-size="20" fill="currentColor">${Math.round(p*100)}%</text></svg>`;
}
function dayHeader(k,pct,title){
  const dow=cur.getDay(),isToday=k===todayKey();
  const label=isToday?"Today":cur.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return `<div class="score">${ring(pct)}<div>
    <div class="eyebrow" style="color:inherit;opacity:.7">${label} · ${DAYN[dow]}</div>
    <div class="day">${esc(title)}</div>
    <div class="meta"><span>Streak <b>${streak()}</b> days</span><span>Workout <b>${Math.round(workoutPct(k)*100)}%</b></span><span>Diet &amp; care <b>${Math.round(carePct(k)*100)}%</b></span></div>
    <div class="datenav"><button data-nav="-1">‹ Prev day</button>${isToday?"":'<button data-nav="0">Back to today</button>'}<button data-nav="1">Next day ›</button></div>
  </div></div>`;
}
function navDay(v){if(v===0){cur=new Date();cur.setHours(0,0,0,0)}else cur.setDate(cur.getDate()+v);renderWorkout();renderDiet()}

/* ---------- Workout ---------- */
function renderWorkout(){
  const k=key(cur),plan=PLAN[cur.getDay()],l=logFor(k);
  let h=dayHeader(k,workoutPct(k),plan.title)+`<div class="card"><h2>Workout checklist</h2>`;
  plan.items.forEach(b=>{
    h+=`<div class="block"><h3>${esc(b.name)}</h3>`;
    b.items.forEach(i=>{
      const on=!!l.ex[i.id];
      h+=`<div class="ex ${on?"done":""}"><input type="checkbox" id="ex-${i.id}" data-ex="${i.id}" ${on?"checked":""}>
      <label for="ex-${i.id}"><div class="name">${esc(i.n)} ${i.isNew?'<span class="tag new">New</span>':""}</div>
      <div class="dose">${esc(i.d)}</div>${i.how?`<div class="how">${esc(i.how)}</div>`:""}</label><span></span>
      <input class="log" type="text" id="log-${i.id}" data-note="${i.id}" placeholder="Reps, weight, band…" value="${esc(l.notes[i.id]||"")}"></div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;
  $("#v-workout").innerHTML=h;
}
$("#v-workout").addEventListener("click",e=>{const n=e.target.closest("[data-nav]");if(n)navDay(+n.dataset.nav)});
$("#v-workout").addEventListener("change",e=>{if(e.target.dataset.ex){logFor(key(cur)).ex[e.target.dataset.ex]=e.target.checked;save();renderWorkout();renderDiet();renderSchedule()}});
$("#v-workout").addEventListener("input",e=>{if(e.target.dataset.note){logFor(key(cur)).notes[e.target.dataset.note]=e.target.value;save()}});

/* ---------- Diet & Care ---------- */
function bottle(i,full){
  return `<button class="bottle ${full?"full":""}" data-cup="${i+1}" aria-label="${i+1} bottle${i?"s":""}" aria-pressed="${full}"><svg viewBox="0 0 34 60" aria-hidden="true">
  <defs><clipPath id="bc${i}"><path d="M12 10h10v4.5c4.5 2 7 5 7 9.5v27.5c0 3.6-2.4 6-6 6H11c-3.6 0-6-2.4-6-6V24c0-4.5 2.5-7.5 7-9.5Z"/></clipPath></defs>
  <rect class="cap" x="11" y="2" width="12" height="6.5" rx="2"/>
  <path class="shell" d="M12 10h10v4.5c4.5 2 7 5 7 9.5v27.5c0 3.6-2.4 6-6 6H11c-3.6 0-6-2.4-6-6V24c0-4.5 2.5-7.5 7-9.5Z"/>
  <g clip-path="url(#bc${i})"><rect class="liquid" x="4" y="20" width="26" height="38"/></g>
  <rect class="shine" x="8.5" y="27" width="2.5" height="18" rx="1.25"/></svg></button>`}
function checklist(list,l){return list.map(x=>{const on=!!l.habits[x.id];return `<label class="habit ${on?"done":""}"><input type="checkbox" data-habit="${x.id}" ${on?"checked":""}>${esc(x.n)}</label>`}).join("")}
function totals(eats){return eats.reduce((t,e)=>{const q=e.q||1;t.cal+=e.cal*q;t.p+=e.p*q;t.c+=e.c*q;t.f+=e.f*q;return t},{cal:0,p:0,c:0,f:0})}
function bar(label,val,goal,unit,note){
  const pct=Math.min(1,val/goal), hit=val>=goal;
  return `<div class="mbar"><div class="mtop"><span><b>${label}</b> <span class="muted small">${note}</span></span><span class="num">${Math.round(val)}${unit} <span class="muted">/ ${goal}${unit}+</span></span></div>
  <div class="track"><div class="fill ${hit?"hit":""}" style="width:${pct*100}%"></div></div></div>`;
}
function fuelMsg(t){
  const T=S.targets,hr=new Date().getHours();
  if(!t.cal)return "Nothing logged yet. Start with your smoothie.";
  if(t.cal>=T.cal&&t.p>=T.p)return "Fuel and protein goals hit. That's a day that builds muscle.";
  if(t.p<T.p)return `You need about ${Math.round(T.p-t.p)}g more protein. Try a cheese stick, yogurt, milk or eggs.`;
  return hr>=17?"Low on fuel for an athlete. Have a real dinner and a snack.":"Keep going. You've got meals left.";
}
function renderDiet(){
  const k=key(cur),l=logFor(k),eats=l.eats,t=totals(eats),T=S.targets;
  const kc=t.p*4+t.c*4+t.f*9||1, sp=[t.p*4/kc,t.c*4/kc,t.f*9/kc];
  let h=dayHeader(k,carePct(k),"Diet & Care");
  h+=`<div class="grid2"><div class="card"><h2>Diet checklist</h2><div class="block">${checklist(DIET,l)}</div></div>
  <div class="card"><h2>Care checklist</h2><div class="block">${checklist(CARE,l)}</div>
    <h3>Water bottles</h3><div class="water">${Array.from({length:WATER_GOAL},(_,i)=>bottle(i,i+1<=(l.water||0))).join("")}
      <div class="wsum"><b>${Math.min(l.water||0,9)}/${WATER_GOAL}</b><span class="small muted">≈ ${Math.round((l.water||0)*BOTTLE_OZ)} oz</span></div></div>
    <p class="small muted">Tap a bottle when you finish it. Drink extra on basketball days.</p></div></div>`;
  // food log
  h+=`<div class="card"><h2>Food log</h2><div class="grid2"><div class="block">
    ${bar("Fuel",t.cal,T.cal,"","calories")}
    ${bar("Protein",t.p,T.p,"g","builds muscle")}
    <div class="macros">
      <div class="best"><div class="v">${Math.round(t.c)}g</div><div class="k">Carbs</div></div>
      <div class="best"><div class="v">${Math.round(t.f)}g</div><div class="k">Fat</div></div>
      <div class="best"><div class="v">${eats.length}</div><div class="k">Items</div></div>
    </div>
    ${eats.length?`<div><div class="split"><span style="flex:${sp[0]};background:var(--accent)"></span><span style="flex:${sp[1]};background:#3b8fd9"></span><span style="flex:${sp[2]};background:var(--good)"></span></div>
      <div class="small muted"><span style="color:var(--accent)">●</span> Protein ${Math.round(sp[0]*100)}% &nbsp; <span style="color:#3b8fd9">●</span> Carbs ${Math.round(sp[1]*100)}% &nbsp; <span style="color:var(--good)">●</span> Fat ${Math.round(sp[2]*100)}%</div></div>`:""}
    <p class="small muted">${fuelMsg(t)}</p>
  </div><div class="block"><h3>Tap to add</h3>

/* label scanning */
let scanOK=true, sampler=true;
function getPass(){try{return localStorage.getItem("fj_pass")||""}catch(e){return ""}}
async function api(path,body){
  let r;
  try{r=await fetch(path,{method:"POST",headers:{"content-type":"application/json","x-app-passcode":getPass()},body:JSON.stringify(body)})}
  catch(e){throw {code:"offline"}}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw {code:j.code||("http_"+r.status)};
  return j;
}
function toB64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(blob)})}
function apiErr(e,what){const c=e&&e.code;
  return c==="unauthorized"?"Enter the app passcode on the Coach tab first.":c==="not_configured"?"The AI key isn't set up on the server yet.":c==="rate_limited"?"The AI is busy right now. Wait a minute and try again.":c==="offline"?"You're offline. Try again when you have internet.":what}
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const m=1400,sc=Math.min(1,m/Math.max(img.width,img.height));
  const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  cv.toBlob(b=>b?res(b):rej(),"image/jpeg",.85);URL.revokeObjectURL(img.src)};img.onerror=rej;img.src=URL.createObjectURL(file)})}
async function scanLabel(file){
  const say=t=>{const el=$("#scan-st");if(el)el.textContent=t};
  if(!sampler){say("Scanning isn't available here. Type the numbers in instead.");return}
  say("Reading the label…");
  try{
    const blob=await shrink(file);
    const r=await api("/api/scan",{image:await toB64(blob)});
    if(!r||!r.ok){say("Couldn't read a label in that photo. Try again closer, with good light, or type the numbers.");return}
    $("#cf-n").value=r.name||"";$("#cf-cal").value=Math.round(+r.cal||0);$("#cf-p").value=Math.round(+r.p||0);$("#cf-c").value=Math.round(+r.c||0);$("#cf-f").value=Math.round(+r.f||0);
    say(`Got it${r.serving?` (1 serving = ${r.serving})`:""}. Check the numbers, then tap Add food.`);
  }catch(e){
    say(apiErr(e,"Scan didn't work. Try another photo or type the numbers."));
  }
}

/* ---------- Reminders (push notifications) ---------- */
const REM_LABEL={workout:["Workout time","Names today's workout"],water:["Drink water","After school"],night:["Night check-in","Finish checklists and log food"],bed:["Bedtime","Lights out for 9 hours of sleep"]};
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const pushSupported="serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
let remState="checking", remMsg="";
let swReg=null;
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").then(r=>{swReg=r;return r.pushManager&&r.pushManager.getSubscription()}).then(sub=>{remState=sub?"on":"off";renderSchedule()}).catch(()=>{remState="off";renderSchedule()})}else{remState="off"}
function remPayload(){const titles={};for(let d=0;d<7;d++)titles[d]=PLAN[d].title;return S.reminders.map(r=>r.id==="workout"?{...r,titles}:r)}
function b64ToU8(b){const p="=".repeat((4-b.length%4)%4);const raw=atob((b+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
function pushErr(e){const c=e&&e.code;return c==="unauthorized"?"Enter your app passcode on the Coach tab first.":c==="storage_missing"?"Reminder storage isn't connected in Vercel yet.":c==="offline"?"You're offline. Try again with internet.":"Something went wrong. Try again in a minute."}
async function remOn(){
  remMsg="";
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){remMsg="Notifications are blocked. Turn them on for FitJourneyAI in your phone's Settings → Notifications.";renderSchedule();return}
    const reg=swReg||await navigator.serviceWorker.ready;
    const keyRes=await fetch("/api/push?a=key");const kj=await keyRes.json().catch(()=>({}));
    if(!keyRes.ok)throw {code:kj.code};
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(kj.publicKey)});
    await api("/api/push",{action:"subscribe",subscription:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone,reminders:remPayload()});
    await api("/api/push",{action:"test",subscription:sub.toJSON()});
    remState="on";toast("Reminders on");
  }catch(e){remMsg=pushErr(e)}
  renderSchedule();
}
async function remOff(){
  try{const reg=swReg||await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    if(sub){await api("/api/push",{action:"unsubscribe",subscription:sub.toJSON()}).catch(()=>{});await sub.unsubscribe()}
    remState="off";toast("Reminders off")}catch(e){remMsg=pushErr(e)}
  renderSchedule();
}
let remSyncT=null;
function remSync(){clearTimeout(remSyncT);remSyncT=setTimeout(async()=>{if(remState!=="on")return;try{const reg=swReg||await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await api("/api/push",{action:"subscribe",subscription:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone,reminders:remPayload()});toast("Reminder times saved")}}catch(e){remMsg=pushErr(e);renderSchedule()}},800)}
function remCard(){
  let top;
  if(!pushSupported&&isIOS&&!standalone)top=`<div class="note">On iPhone, reminders only work from the Home Screen app. Tap <b>Share</b> → <b>Add to Home Screen</b>, open FitJourneyAI from the new icon, then come back here.</div>`;

let chartEx="Pull-ups";
function bestOf(ex){const m=S.maxes.filter(x=>x.ex===ex);return m.length?Math.max(...m.map(x=>x.val)):null}
function lineChart(pts,unit,color){
  if(pts.length<2)return `<div class="empty">Log this ${pts.length?"one more time":"twice"} to see a chart.</div>`;
  const W=640,H=220,L=40,R=14,T=14,B=30;
  const vals=pts.map(p=>p.v),lo=Math.min(...vals),hi=Math.max(...vals);
  let a=unit==="lb (body)"?Math.floor(lo-3):0,b=Math.max(a+5,Math.ceil(hi+(unit==="lb (body)"?3:1)));
  const step=(b-a)/4;
  const x=i=>L+i*(W-L-R)/(pts.length-1), y=v=>T+(H-T-B)*(1-(v-a)/(b-a));
  let g="";
  for(let j=0;j<=4;j++){const v=a+step*j;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v*10)/10}</text>`}
  pts.forEach((p,i)=>{if(i===0||i===pts.length-1||pts.length<7)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" font-size="11" fill="var(--muted)">${esc(p.d.slice(5))}</text>`});
  g+=`<polyline points="${pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
  pts.forEach((p,i)=>g+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}" fill="${color}"/>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">${g}</svg>`;
}
function renderProgress(){
  const allEx=[...new Set([...MAXEX.map(m=>m[0]),...S.maxes.map(m=>m.ex)])];
  const logged=allEx.filter(e=>bestOf(e)!==null);
  const unitOf=ex=>(MAXEX.find(m=>m[0]===ex)||[,(S.maxes.find(m=>m.ex===ex)||{}).unit||"reps"])[1];
  const body=[...S.body].sort((a,b)=>a.date<b.date?-1:1);
  const lastW=body.filter(b=>b.w).slice(-1)[0];
  let h=`<div class="card"><h2>My bests</h2>`;
  h+=logged.length?`<div class="bests">${logged.map(e=>`<div class="best"><div class="v">${bestOf(e)}<span class="small muted"> ${esc(unitOf(e))}</span></div><div class="k">${esc(e)}</div></div>`).join("")}
    ${lastW?`<div class="best"><div class="v">${lastW.w}<span class="small muted"> lb</span></div><div class="k">Weight (latest)</div></div>`:""}</div>`
    :`<div class="empty">No maxes yet. Log your first ones below. This Sunday's pull-up test is a great start.</div>`;
  h+=`</div><div class="grid2"><div class="card"><h2>Log a max</h2>
    <div class="prform">
      <label class="f">Exercise<select id="mx-ex">${allEx.map(e=>`<option ${e===chartEx?"selected":""}>${esc(e)}</option>`).join("")}<option value="__new">+ New exercise…</option></select></label>
      <label class="f" id="mx-newwrap" hidden>New exercise name<input type="text" id="mx-new" placeholder="e.g. Box jump height"></label>
      <label class="f">Result<input type="number" id="mx-val" inputmode="decimal" placeholder="12"></label>
      <label class="f">Unit<select id="mx-unit"><option>reps</option><option>sec</option><option>lb</option><option>in</option></select></label>
      <label class="f">Date<input type="text" id="mx-date" value="${todayKey()}"></label>
      <label class="f">Note<input type="text" id="mx-note" placeholder="Band, form…"></label>
    </div><button class="btn" id="mx-save">Save max</button></div>
  <div class="card"><h2>Sunday pull-up test</h2><p class="small muted">Log all 5 at once. Write the band you used, or "none".</p>
    <div class="prform">${PULLTEST.map(([n,u],i)=>`<label class="f">${n} (${u})<input type="number" min="0" inputmode="numeric" id="pt-${i}"></label>`).join("")}
      <label class="f">Band<input type="text" id="pt-band" placeholder="e.g. red band"></label></div>
    <button class="btn" id="pt-save">Save test</button></div></div>`;
  // chart
  const pts=S.maxes.filter(m=>m.ex===chartEx).sort((a,b)=>a.date<b.date?-1:1).map(m=>({d:m.date,v:m.val}));
  h+=`<div class="card chart"><div class="mtop"><h2>Chart</h2><select id="ch-ex" style="width:auto">${allEx.map(e=>`<option ${e===chartEx?"selected":""}>${esc(e)}</option>`).join("")}</select></div>${lineChart(pts,unitOf(chartEx),"var(--accent)")}</div>`;
  // body
  h+=`<div class="grid2"><div class="card"><h2>Weight &amp; height</h2>
    <p class="small muted">Weigh in once a week, same day, in the morning. Your weight going up is normal: you're growing and adding muscle. Track your maxes to see if you're getting stronger.</p>
    <div class="prform"><label class="f">Date<input type="text" id="bw-date" value="${todayKey()}"></label>
      <label class="f">Weight (lb)<input type="number" id="bw-w" inputmode="decimal" placeholder="120"></label>
      <label class="f">Height (in)<input type="number" id="bw-h" inputmode="decimal" placeholder="optional"></label></div>
    <button class="btn" id="bw-save">Save</button></div>
    <div class="card chart"><h2>Weight over time</h2>${lineChart(body.filter(b=>b.w).map(b=>({d:b.date,v:b.w})),"lb (body)","#3b8fd9")}</div></div>`;
  // history
  const hist=[...S.maxes.map(m=>({...m,kind:"m"})),...S.body.map(b=>({...b,kind:"b"}))].sort((a,b)=>a.date<b.date?1:-1).slice(0,30);
  if(hist.length){
    h+=`<details class="card" data-d="hist"><summary><h2>History</h2></summary><div class="tablewrap"><table><thead><tr><th>Date</th><th>What</th><th>Result</th><th>Note</th><th></th></tr></thead><tbody>`;
    hist.forEach(x=>h+=x.kind==="m"?`<tr><td class="num">${esc(x.date)}</td><td>${esc(x.ex)}</td><td class="num">${x.val} ${esc(x.unit)}</td><td>${esc(x.note||"")}</td><td><button class="btn ghost sm" data-mdel="${esc(x.id)}">Remove</button></td></tr>`
      :`<tr><td class="num">${esc(x.date)}</td><td>Weight / height</td><td class="num">${x.w?x.w+" lb":""}${x.h?" · "+x.h+" in":""}</td><td></td><td><button class="btn ghost sm" data-bdel="${esc(x.id)}">Remove</button></td></tr>`);
    h+=`</tbody></table></div></details>`;
  }
  h+=`<div class="card"><h2>My goals</h2><textarea id="goals">${esc(S.goals)}</textarea></div>`;
  $("#v-progress").innerHTML=h;
  syncUnit();
}
function syncUnit(){const s=$("#mx-ex");if(!s)return;const ex=s.value;$("#mx-newwrap").hidden=ex!=="__new";const m=MAXEX.find(x=>x[0]===ex);const prev=S.maxes.find(x=>x.ex===ex);$("#mx-unit").value=m?m[1]:prev?prev.unit:"reps"}
const P=$("#v-progress");
P.addEventListener("change",e=>{
  if(e.target.id==="mx-ex")syncUnit();
  if(e.target.id==="ch-ex"){chartEx=e.target.value;renderProgress()}
});
P.addEventListener("input",e=>{if(e.target.id==="goals"){S.goals=e.target.value;save()}});
P.addEventListener("click",e=>{
  const id=e.target.id;
  if(id==="mx-save"){
    let ex=$("#mx-ex").value;if(ex==="__new")ex=$("#mx-new").value.trim();
    const v=$("#mx-val").value;if(!ex||v==="")return;
    S.maxes.push({id:String(Date.now()),date:$("#mx-date").value||todayKey(),ex,val:+v,unit:$("#mx-unit").value,note:$("#mx-note").value});
    chartEx=ex;save();renderProgress();
  }
  if(id==="pt-save"){
    const d=todayKey(),band=$("#pt-band").value;let any=false;
    PULLTEST.forEach(([n,u],i)=>{const v=$("#pt-"+i).value;if(v!==""){S.maxes.push({id:Date.now()+"_"+i,date:d,ex:n,val:+v,unit:u,note:band});any=true}});
    if(any){chartEx="Pull-ups";save();renderProgress()}
  }
  if(id==="bw-save"){
    const w=$("#bw-w").value,hh=$("#bw-h").value;if(w===""&&hh==="")return;
    S.body.push({id:String(Date.now()),date:$("#bw-date").value||todayKey(),w:w===""?null:+w,h:hh===""?null:+hh});save();renderProgress();
  }
  const md=e.target.closest("[data-mdel]");if(md){S.maxes=S.maxes.filter(m=>m.id!==md.dataset.mdel);save();renderProgress();$('[data-d="hist"]')&&($('[data-d="hist"]').open=true)}
  const bd=e.target.closest("[data-bdel]");if(bd){S.body=S.body.filter(m=>m.id!==bd.dataset.bdel);save();renderProgress();$('[data-d="hist"]')&&($('[data-d="hist"]').open=true)}
});

/* ---------- Coach chat ---------- */
let chat=[]; let chatBusy=false, chatAbort=null;
try{chat=JSON.parse(localStorage.getItem("cb_chat")||"[]")}catch(e){chat=[]}
const STARTERS=["Review my day so far","What should I eat before basketball?","How do I get my first real pull-up?","I'm sore. Should I still train?","Give me a smoothie that has more protein"];
function coachContext(){
  const k=todayKey(),d=new Date(),l=S.logs[k]||{ex:{},habits:{},eats:[],water:0};
  const plan=PLAN[d.getDay()];
  const done=plan.items.flatMap(b=>b.items).map(i=>`${i.n} (${i.d}): ${l.ex&&l.ex[i.id]?"done":"not yet"}${l.notes&&l.notes[i.id]?" – "+l.notes[i.id]:""}`).join("\n");
  const t=totals(l.eats||[]);
  const week=[1,2,3,4,5,6,0].map(n=>`${DAYN[n]}: ${PLAN[n].items.map(b=>b.name+" ("+b.items.map(x=>x.n+" "+x.d).join(", ")+")").join("; ")}`).join("\n");
  const bests=[...new Set(S.maxes.map(m=>m.ex))].map(e=>`${e}: best ${bestOf(e)} ${S.maxes.find(m=>m.ex===e).unit}`).join("; ")||"none logged yet";
  const lastW=S.body.filter(b=>b.w).sort((a,b)=>a.date<b.date?-1:1).slice(-1)[0];
  return `You are "Coach", a friendly, upbeat fitness and nutrition coach inside a 13-year-old boy's personal training app. He plays basketball and does MMA. His goals: ${S.goals}
Rules:
- Talk like a supportive coach to a 13-year-old: short, clear, encouraging. Usually under 120 words. Use simple bullet points when listing steps.
- Give safe, age-appropriate advice. Body-weight, band and light-dumbbell training with good form is great. No max-weight lifting, no "cutting", no eating less, no skipping meals, no supplements, fat burners, creatine or protein powders unless a parent or doctor approves.
- His calorie and protein targets are minimums for a growing athlete. Encourage eating enough, protein at every meal, carbs for sport, water, and 9 hours of sleep.
- For pain (not normal soreness), injury, dizziness, or anything medical, tell him to stop and talk to a parent, coach or doctor.
- If he says anything about hating his body, wanting to starve, or feeling really down, respond kindly and tell him to talk to a parent or trusted adult right away.
- Use his real data below when it helps. Don't make up numbers he didn't log.

His data (today is ${DAYN[d.getDay()]} ${k}):
Equipment: ${S.gear.join(", ")}. Dumbbells: ${S.dumbbells||"not listed"}. Bands: ${S.bands||"not listed"}.
Weekly plan:
${week}
Today's workout (${plan.title}):
${done}
Today's food so far: ${(l.eats||[]).map(e=>e.n+(e.q&&e.q!==1?" x"+e.q:"")).join(", ")||"nothing logged"}. Totals: ${Math.round(t.cal)} cal, ${Math.round(t.p)}g protein, ${Math.round(t.c)}g carbs, ${Math.round(t.f)}g fat. Targets (minimums): ${S.targets.cal} cal, ${S.targets.p}g protein.
Checklist today: ${HABITS.map(h=>h.n+": "+(l.habits&&l.habits[h.id]?"yes":"no")).join("; ")}. Water: ${l.water||0}/${WATER_GOAL} bottles (16.9 oz each).
Foods in his kitchen: ${S.pantry.filter(p=>p.have).map(p=>p.n).join(", ")}.
Personal bests: ${bests}. Latest weight: ${lastW?lastW.w+" lb on "+lastW.date:"not logged"}.`;
}
function renderCoach(){
  let h=`<div class="card"><h2>Coach</h2><p class="small muted">Ask anything about training, food, sleep or recovery. Coach can see your plan, today's checklists, your food log and your bests (they're sent to the AI only when you ask something). For pain or injuries, always talk to a parent or doctor.</p>
  <div class="chat" id="chat">${chat.length?chat.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join(""):`<div class="empty">Pick a question below or type your own.</div>`}</div>
  <div class="chips">${STARTERS.map(q=>`<button class="chip" data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div>
  <div class="ask"><textarea id="ask-in" placeholder="Ask Coach…" ${chatBusy?"disabled":""}></textarea><button class="btn" id="ask-btn" ${chatBusy?"disabled":""}>${chatBusy?"…":"Send"}</button></div>
  <details class="passbox" ${getPass()?"":"open"}><summary class="small muted">App passcode</summary><div class="addrow"><input type="password" id="pass-in" placeholder="Passcode from your Vercel settings" value="${esc(getPass())}"><button class="btn sm" id="pass-btn">Save</button></div></details>
  <div class="mtop"><span class="small muted" id="coach-st"></span>${chat.length?'<button class="btn ghost sm" id="chat-clear">Clear chat</button>':""}</div></div>`;
  $("#v-coach").innerHTML=h;
  const c=$("#chat");if(c.lastElementChild)c.lastElementChild.scrollIntoView({block:"nearest"});
}
function saveChat(){try{localStorage.setItem("cb_chat",JSON.stringify(chat.slice(-30)))}catch(e){}}
async function askCoach(q){
  q=q.trim();if(!q||chatBusy)return;
  chat.push({role:"user",content:q});chatBusy=true;renderCoach();
  const box=document.createElement("div");box.className="msg ai";box.textContent="Thinking…";$("#chat").appendChild(box);box.scrollIntoView({block:"nearest"});
  const recent=chat.slice(-12);
  try{
    const r=await api("/api/coach",{context:coachContext(),messages:recent});box.textContent=r.text;
    chat.push({role:"assistant",content:r.text});
  }catch(e){
    const msg=apiErr(e,"Coach couldn't answer. Try again.");chat.pop();
    chatBusy=false;renderCoach();$("#coach-st").textContent=msg;saveChat();return;
  }
  chatBusy=false;saveChat();renderCoach();
}
$("#v-coach").addEventListener("click",e=>{
  const a=e.target.closest("[data-ask]");if(a){askCoach(a.dataset.ask);return}
  if(e.target.id==="ask-btn"){askCoach($("#ask-in").value)}
  if(e.target.id==="chat-clear"){chat=[];saveChat();renderCoach()}
  if(e.target.id==="pass-btn"){try{localStorage.setItem("fj_pass",$("#pass-in").value.trim())}catch(x){}renderCoach();$("#coach-st").textContent="Passcode saved."}
});
$("#v-coach").addEventListener("keydown",e=>{if(e.target.id==="ask-in"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();askCoach(e.target.value)}});

function render(){renderSchedule();renderWorkout();renderDiet();renderProgress();renderCoach()}
render();
try{const t=localStorage.getItem("cb_tab2");if(t&&document.getElementById("v-"+t))showTab(t)}catch(e){}
</script>

</body></html>
